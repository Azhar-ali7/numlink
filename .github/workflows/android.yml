name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: numlink_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: numlink-release-apk
          path: numlink_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          APK=build/app/outputs/flutter-apk/app-release.apk
          gh release create "v$V" "$APK" --title "v$V" --notes "Automated build ${{ github.sha }}" \
            || gh release upload "v$V" "$APK" --clobber
