name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.0

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: numlink_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: numlink_app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    # macOS runner is required for any iOS build; free on public repos.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: numlink_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned: CI has no Apple signing identity or provisioning profile, so
      # `flutter build ipa` cannot run. Building the .app and zipping it as a
      # Payload/ produces the same archive layout — sideloaders (AltStore,
      # Sideloadly) re-sign it with the user's own Apple ID on install.
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry numlink-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: numlink_app/numlink-unsigned.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # --generate-notes needs history to diff against the last tag
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep '^version:' numlink_app/pubspec.yaml | sed 's/version: //;s/+.*//')
          mv dist/apk/app-release.apk "dist/numlink-$V.apk"
          mv dist/ipa/numlink-unsigned.ipa "dist/numlink-$V-unsigned.ipa"
          cat > notes.md <<'EOF'
          **NUMLINK** is a daily number puzzle. You start on one number and chain
          operations — `×3`, `+7`, `÷2`, `%5` — down a branching tree until every
          target is on the board, in as few moves as you can.

          - **Daily** — one board a day, the same one for everyone.
          - **Campaign** — 24 levels that introduce one operator at a time.
          - **Free Play** — four difficulties, from Kids (one target, one move,
            `+ − ×`) to Expert (five targets, four deep, every operator).
          - **Timed** — an eight-stage ladder against the clock.
          - **Weekend Co-op** — a shared board that resets on Monday.

          Boards are generated solution-first and guarded: the game refuses any
          move that would make a target unreachable, so every board you are dealt
          can be finished.

          ## Downloads

          | File | Platform | Install |
          |---|---|---|
          | `numlink-VERSION.apk` | Android | Download and open. Allow installs from unknown sources when prompted. |
          | `numlink-VERSION-unsigned.ipa` | iOS | **Unsigned.** Sideload with [AltStore](https://altstore.io) or [Sideloadly](https://sideloadly.io), which re-sign it with your own Apple ID. It will not install by download alone. |

          ## Changelog
          EOF
          sed -i "s/VERSION/$V/g" notes.md
          gh release create "v$V" dist/numlink-*.apk dist/numlink-*.ipa \
            --title "NUMLINK v$V" --notes-file notes.md --generate-notes \
          || gh release upload "v$V" dist/numlink-*.apk dist/numlink-*.ipa --clobber
